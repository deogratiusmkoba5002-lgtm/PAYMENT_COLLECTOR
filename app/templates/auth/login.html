{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>{{ t('login_title') }}</h1>
  <form method="POST" novalidate>
    {{ form.hidden_tag() }}
    <label>{{ t('login_email') }} {{ form.email(class_="input") }}</label>
    <label>{{ t('login_password') }} {{ form.password(class_="input") }}</label>
    {{ form.submit(class_="btn btn-primary", value=t('login_submit')) }}
  </form>
  <p>{{ t('login_no_account') }} <a href="{{ url_for('auth.register') }}">{{ t('login_register_link') }}</a></p>
</div>
{% endblock %}
